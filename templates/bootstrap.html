    <style>

        /* =========================
           PAGE BACKGROUND
           ========================= */

        body {

            background: linear-gradient(
                135deg,
                #111827,
                #1e3a8a
            );

            min-height: 100vh;

            padding-top: 50px;

            padding-bottom: 50px;
        }


        /* =========================
           MAIN HEADING
           ========================= */

        .heading {

            color: white;

            font-weight: bold;

            font-style: italic;

            text-shadow: 3px 3px 8px black;

            animation: headingAnimation 2s ease-in-out;
        }


        /* =========================
           CAROUSEL
           ========================= */

        .my-carousel {

            max-width: 900px;

            margin: 0 auto 50px auto;

            border-radius: 20px;

            overflow: hidden;

            box-shadow:
                0px 15px 40px rgba(0, 0, 0, 0.7);
        }


        /* Carousel images */

        .my-carousel img {

            height: 450px;

            object-fit: cover;
        }


        /* Carousel caption */

        .my-carousel .carousel-caption {

            background: rgba(0, 0, 0, 0.65);

            border-radius: 15px;

            padding: 15px;
        }


        .my-carousel .carousel-caption h5 {

            color: white;

            font-weight: bold;

            font-size: 25px;
        }


        .my-carousel .carousel-caption p {

            color: white;

            font-style: italic;
        }


        /* =========================
           KOHLI CARD
           ========================= */

        .kohli-card {

            border: none;

            border-radius: 20px;

            box-shadow:
                0px 10px 30px rgba(0, 0, 0, 0.6);

            overflow: hidden;

            transition:
                transform 0.4s ease,
                box-shadow 0.4s ease;
        }


        /* Card hover animation */

        .kohli-card:hover {

            transform:
                translateY(-15px)
                scale(1.03);

            box-shadow:
                0px 20px 50px rgba(0, 0, 0, 0.8);
        }


        /* =========================
           CARD IMAGE
           ========================= */

        .kohli-card img {

            height: 350px;

            object-fit: cover;

            transition:
                transform 0.5s ease;
        }


        /* Image zoom when card is hovered */

        .kohli-card:hover img {

            transform: scale(1.08);
        }


        /* =========================
           CARD TITLE
           ========================= */

        .card-title {

            font-weight: bold;

            font-style: italic;

            color: #1e3a8a;
        }


        /* =========================
           CARD DESCRIPTION
           ========================= */

        .card-text {

            font-style: italic;

            font-weight: 500;
        }


        /* =========================
           KNOW MORE BUTTON
           ========================= */

        .btn-custom {

            border-radius: 30px;

            font-weight: bold;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }


        /* Button hover animation */

        .btn-custom:hover {

            transform: scale(1.1);

            box-shadow:
                0px 5px 15px rgba(0, 0, 0, 0.4);
        }


        /* =========================
           HEADING ANIMATION
           ========================= */

        @keyframes headingAnimation {

            from {

                opacity: 0;

                transform:
                    translateY(-50px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }

        }

    </style>

</head>
