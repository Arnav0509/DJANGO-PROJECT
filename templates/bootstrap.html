<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Virat Kohli</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        /* Page background */
        body {
            background: linear-gradient(135deg, #111827, #1e3a8a);
            min-height: 100vh;
            padding-top: 50px;
        }

        /* Main heading */
        .heading {
            color: white;
            font-weight: bold;
            font-style: italic;
            text-shadow: 3px 3px 8px black;

            animation: headingAnimation 2s ease-in-out;
        }

        /* Card */
        .kohli-card {
            border: none;
            border-radius: 20px;

            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.6);

            overflow: hidden;

            transition: transform 0.4s ease,
                        box-shadow 0.4s ease;
        }

        /* Card hover animation */
        .kohli-card:hover {
            transform: translateY(-15px) scale(1.03);

            box-shadow: 0px 20px 50px rgba(0, 0, 0, 0.8);
        }

        /* Image */
        .kohli-card img {
            height: 350px;
            object-fit: cover;

            transition: transform 0.5s ease;
        }

        /* Image zoom */
        .kohli-card:hover img {
            transform: scale(1.08);
        }

        /* Card title */
        .card-title {
            font-weight: bold;
            font-style: italic;
            color: #1e3a8a;
        }

        /* Description */
        .card-text {
            font-style: italic;
            font-weight: 500;
        }

        /* Button */
        .btn-custom {
            border-radius: 30px;
            font-weight: bold;

            transition: transform 0.3s ease,
                        box-shadow 0.3s ease;
        }

        .btn-custom:hover {
            transform: scale(1.1);

            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.4);
        }

        /* Heading animation */
        @keyframes headingAnimation {

            from {
                opacity: 0;
                transform: translateY(-50px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

    </style>

</head>

<body>

    <div class="container text-center">

        <h1 class="heading mb-4">
            VIRAT KOHLI
        </h1>

        <div class="card kohli-card mx-auto"
             style="width: 22rem;">

            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT8feiudebGvoX-9kViJqvQQPXod7-KRxXFFJu0jdepPQ&s=10"
                 class="card-img-top"
                 alt="Virat Kohli">

            <div class="card-body">

                <h2 class="card-title">
                    VIRAT KOHLI
                </h2>

                <p class="card-text">
                    "For 60 overs they should feel like hell out there."
                </p>

                <a href="https://timesofindia.indiatimes.com/sports/cricket/news/watch-they-should-feel-like-hell-when-virat-kohli-delivered-an-iconic-speech-at-lords/articleshow/123331242.cms" class="btn btn-primary btn-custom">
                    Know More
                </a>

            </div>

        </div>

    </div>

</body>

</html>

</body>
</html>
